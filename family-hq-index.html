<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Family HQ</title><style>
:root{--accent:#ee7c26;--bg:#f3f5f7;--panel:#fff;--ink:#1d2939;--sub:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}header{background:var(--panel);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--accent)}h1{font-size:25px;margin:0}small{color:var(--sub)}#clock{font-size:34px;font-weight:800}.wrap{padding:14px;max-width:1100px;margin:auto}.hero{background:var(--accent);color:white;border-radius:15px;padding:14px 18px;margin-bottom:12px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--panel);border-radius:16px;padding:16px;box-shadow:0 2px 8px #0000000b}.card h2{margin:0 0 6px;font-size:22px}.score{font-weight:700;color:var(--accent);margin-bottom:12px}.task{display:block;width:100%;text-align:left;background:#f3f5f8;border:0;border-radius:10px;padding:13px;margin:7px 0;font-size:16px;color:var(--ink)}.task.done{background:#dcfce7;text-decoration:line-through;color:#276749}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.bottom{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}button{cursor:pointer}select,.action{font-size:15px;padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:white}.action{background:var(--accent);color:white;border:0}.muted{color:var(--sub)}body[data-theme=minecraft]{--accent:#39854c;--bg:#eaf2e7}body[data-theme=clasico]{--accent:#4263a5;--bg:#eef2f8}body[data-theme=espacio]{--accent:#6554b9;--bg:#eceafa}@media(max-width:520px){.grid,.bottom{grid-template-columns:1fr}header{padding:12px}#clock{font-size:27px}.wrap{padding:9px}}@media(min-width:700px){.card{min-height:300px}}
</style></head><body data-theme="naruto"><header><div><h1 id="brand">🍥 Family HQ</h1><small id="date"></small></div><div id="clock">--:--</div></header><main class="wrap"><div class="hero" id="mission">🥷 ¡Completa tus misiones del día!</div><div class="grid" id="kids"></div><div class="bottom"><section class="card"><h2>📅 Agenda familiar</h2><p class="muted">Aquí conectaremos el calendario familiar.</p><p>🎒 Colegio · 🏠 Casa · ⚽ Actividades</p></section><section class="card"><h2>⚙️ Ajustes</h2><p class="muted">Cambia la apariencia sin perder el progreso.</p><div class="row"><label for="theme">Tema visual</label><select id="theme"><option value="naruto">🍥 Academia Ninja</option><option value="minecraft">🟩 Bloques</option><option value="clasico">🏡 Clásico</option><option value="espacio">🚀 Espacio</option></select></div><p><button class="action" id="reset">Reiniciar misiones de hoy</button></p></section></div></main><script>
(function(){var names=['Viktor','Daniella'],tasks=['Vestirse','Desayunar','Lavarse los dientes','Preparar mochila'],prefix='familyhq-v1-',theme=document.getElementById('theme');function day(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}function key(n,i){return prefix+day()+'-'+n+'-'+i}function read(k){try{return localStorage.getItem(k)}catch(e){return null}}function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}function render(){var root=document.getElementById('kids');root.innerHTML='';for(var a=0;a<names.length;a++){var n=names[a],done=0;for(var j=0;j<tasks.length;j++)if(read(key(n,j))==='1')done++;var card=document.createElement('section');card.className='card';var h=document.createElement('h2');h.textContent=(a===0?'🔵 ':'🟣 ')+n;card.appendChild(h);var s=document.createElement('div');s.className='score';s.textContent='⭐ '+(done*10)+' puntos · '+done+'/'+tasks.length+' misiones';card.appendChild(s);for(var i=0;i<tasks.length;i++){(function(name,index){var b=document.createElement('button');var checked=read(key(name,index))==='1';b.className='task'+(checked?' done':'');b.textContent=(checked?'✓ ':'○ ')+tasks[index];b.onclick=function(){save(key(name,index),checked?'0':'1');render()};card.appendChild(b)})(n,i)}root.appendChild(card)}}function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);document.getElementById('date').textContent=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}theme.value=read(prefix+'theme')||'naruto';function setTheme(){document.body.setAttribute('data-theme',theme.value);save(prefix+'theme',theme.value);document.getElementById('mission').textContent=theme.value==='naruto'?'🥷 ¡Completa tus misiones del día!':theme.value==='minecraft'?'⛏️ ¡Completa tus retos de hoy!':theme.value==='espacio'?'🚀 ¡Preparados para la misión!':'🌟 ¡Vamos a por un gran día!'}theme.onchange=setTheme;document.getElementById('reset').onclick=function(){if(!confirm('¿Reiniciar las tareas de hoy?'))return;for(var a=0;a<names.length;a++)for(var i=0;i<tasks.length;i++)save(key(names[a],i),'0');render()};setTheme();render();tick();setInterval(tick,30000)})();
</script></body></html>
